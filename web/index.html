<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Buscapet - Red Social Solidaria de Mascotas Perdidas, Encontradas y Adopción">
  <meta name="theme-color" content="#0F1117">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Buscapet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Buscapet — Reuniendo Mascotas con sus Familias</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F1117;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #1E2330 0%, #0F1117 100%);
    }
    .logo-container {
      font-size: 54px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      margin-top: 14px;
      background: linear-gradient(135deg, #FF6B4A, #FF8C69);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-top: 6px;
      font-weight: 500;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin-top: 24px;
      border: 3px solid rgba(255, 107, 74, 0.2);
      border-top: 3px solid #FF6B4A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="logo-container">🐾</div>
    <div class="title">Buscapet</div>
    <div class="subtitle">Cargando la red solidaria de mascotas...</div>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
